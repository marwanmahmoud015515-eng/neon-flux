const NL=30;

function buildLevel(i){
  const R=mulberry32(i*7919+1013), D=Math.min(1,i/(NL-1));
  const L={p:[],m:[],e:[],j:[],k:[],c:[],w:[],h:[],cp:[],bg:i};
  let x=0, gy=520;
  L.p.push([0,gy,440,90]);
  L.s=[90,gy-72];
  L.cp.push([130,gy]);
  L.w.push([300,gy-62,1]);
  x=440;
  const segs=12+Math.round(i*1.4);
  for(let s=0;s<segs;s++){
    const w=Math.round(250+R()*190);
    const gap=Math.round(80+R()*(60+D*80));
    x+=gap;
    gy=Math.round(clamp(gy+(R()-.5)*140,340,580));
    L.p.push([x,gy,w,90]);
    if(R()<.65){
      const fw=Math.round(90+R()*90),fx=Math.round(x+R()*(w-fw)),fy=Math.round(gy-150-R()*80);
      L.p.push([fx,fy,fw,20]);
      if(R()<.55)L.c.push([fx+fw/2,fy-44]);
    }
    if(R()<.4){
      const fw=Math.round(80+R()*70),fx=Math.round(x+R()*(w-fw)),fy=Math.round(gy-290-R()*60);
      L.p.push([fx,fy,fw,20]);
      if(R()<.5)L.c.push([fx+fw/2,fy-44]);
    }
    if(gap>115&&R()<.8){
      const mw=96, axis=R()<.5?'x':'y';
      if(axis=='x') L.m.push([Math.round(x-gap/2-mw/2), Math.round(gy-90-R()*60), mw,20, Math.round(x-gap-mw+10), Math.round(x-mw-10), 0.9+R()*0.8,'x']);
      else L.m.push([Math.round(x-gap/2-mw/2), gy-40, mw,20, gy-40, gy-200, 0.35+R()*0.25,'y']);
    }
    if(R()<.35&&w>230){
      const sw=Math.round(50+R()*60), sx=Math.round(x+40+R()*(w-80-sw));
      L.k.push([sx,gy-20,sw]);
    }
    if(R()<.22) L.j.push([Math.round(x+w*.65),gy-30]);
    const nc=2+Math.floor(R()*3);
    for(let c=0;c<nc;c++) L.c.push([Math.round(x+w*(c+1)/(nc+1)), Math.round(gy-80-R()*90)]);
    const ec=1+Math.floor(R()*(1+D*2.2));
    for(let k=0;k<ec;k++){
      const pool=['w','w','d'];
      if(i>=1)pool.push('h');
      if(i>=2)pool.push('s');
      if(i>=4)pool.push('t');
      const t=pool[Math.floor(R()*pool.length)];
      const ex=Math.round(x+40+R()*(w-80));
      L.e.push({t,x:ex,gy,lo:x+16,hi:x+w-46,sp:1.4+D*1.9});
    }
    if(R()<.28) L.h.push([Math.round(x+w/2), gy-130]);
    if(s>2&&R()<.4) L.w.push([Math.round(x+w/2), gy-64, 1+Math.floor(R()*3)]);
    if(s%4==3) L.cp.push([Math.round(x+w/2), gy]);
    x+=w;
  }
  const ax=x+200, ay=gy;
  L.p.push([ax-180, ay, 1620, 100]);
  L.p.push([ax-210, ay-580, 40, 590]);
  L.p.push([ax+1440, ay-580, 40, 590]);
  L.p.push([ax+380, ay-260, 200, 24]);
  L.p.push([ax+900, ay-320, 200, 24]);
  L.ar={x:ax-140,y:ay,w:1540};
  L.cp.push([ax-120, ay]);
  L.c.push([ax+460, ay-320]);
  L.c.push([ax+980, ay-380]);
  L.h.push([ax+200, ay-110]);
  L.w.push([ax+250, ay-64, 3]);
  L.g=[ax+1330, ay-120];
  L.bs=i;
  L.minX=-300; L.maxX=ax+1480; L.minY=-900; L.maxY=1200;
  return L;
}

G.buy=function(item){
  const prices={weapon5:40,hp:30,skin1:20,skin2:20,skin3:30};
  const price=prices[item];
  if(!price)return;
  const un=this.unlocks=this.unlocks||{};
  if(un[item]){
    if(item.startsWith('skin')){
      this.skin=(this.skin===item)?'':item;
      sv('skin',this.skin);A.pickup();this.shop();
    }
    return;
  }
  if((this.totalCoins||0)<price){
    A.t('square',200,100,.2,.15);flash=.3;return;
  }
  this.totalCoins-=price;sv('totalCoins',this.totalCoins);
  un[item]=true;sv('unlocks',this.unlocks);
  A.pickup();flash=.4;
  if(item.startsWith('skin')){this.skin=item;sv('skin',this.skin)}
  if(item==='weapon5'){
    if(!WPN.find(w=>w.k==='5'))WPN.push({k:'5',n:'صاروخ موجه',e:'Homing',c:'#ff6600',cd:55,dmg:3,spd:9,r:6,homing:true,start:5,sfx:'launch'});
  }
  this.shop();
};

G.dmgEnemy=function(e,n,dx=0,dy=0){
  if(!e.alive)return;
  e.hp-=n;e.flash=8;
  emit(e.x+e.w/2,e.y+e.h/2,7,'#fff',4.5,3);
  this.ft.push({s:'-'+n,x:e.x+e.w/2+rnd(-10,10),y:e.y-5,t:32,
    c:n>=3?'#ffd23f':n>=2?'#ff8cf0':'#fff',sz:n>=3?24:18});
  if(e.hp<=0){
    e.alive=false;A.bounce();shake=Math.max(shake,6);
    emit(e.x+e.w/2,e.y+e.h/2,24,ECO[e.t]||'#ff2bd6',6.5,4);
    ring(e.x+e.w/2,e.y+e.h/2,34,ECO[e.t]||'#ff2bd6');
    if(Math.random()<.34)this.drops.push({x:e.x+e.w/2,y:e.y+e.h/2,t:'ammo',bob:0,vy:-5});
    else if(Math.random()<.14)this.drops.push({x:e.x+e.w/2,y:e.y+e.h/2,t:'hp',bob:0,vy:-5});
  }else{
    const d=Math.hypot(dx,dy)||1;
    e.x+=dx/d*5;e.y=Math.min(e.y,e.y0-3);
  }
};

G.damagePlayer=function(n,kbx=0,kby=0){

G.shoot=function(){
  const w=WPN[P.wp];
  if(P.scd>0)return;
  if(!w.inf&&P.ammo[P.wp]<=0){A.t('square',180,110,.07,.07);P.scd=14;return}
  P.scd=w.cd;
  if(!w.inf)P.ammo[P.wp]--;
  P.recoil=6;
  const mx=P.x+13+P.face*18,my=P.y+16;
  const n=w.pellets||1;
  for(let k=0;k<n;k++){
    const a=(n>1?(k-(n-1)/2)*w.spread:0)+rnd(-.03,.03);
    this.bol.push({
      x:mx,y:my,vx:Math.cos(a)*w.spd*P.face,vy:Math.sin(a)*w.spd,
      dmg:w.dmg,l:w.pierce?90:70,type:P.wp,col:w.c,r:w.r,
      pierce:w.pierce||0,grav:w.grav||0,explode:w.explode||0,
      homing:w.homing||false,hitList:[]
    });
  }
  emit(mx,my,5,w.c,4,3);
  ring(mx,my,16,w.c);
  A[w.sfx]?A[w.sfx]():A.shoot();
  this.syncHud();
};

G.update=function(){
  if(this.slowmo>0){this.slowmo--;if(this.slowmo%2)return}
  this.t++;
  for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.99;p.a-=p.d;if(p.a<=0)PT.splice(i,1)}
  for(let i=RINGS.length-1;i>=0;i--){const r=RINGS[i];r.r+=(r.mr-r.r)*.18;r.a-=.045;if(r.a<=0)RINGS.splice(i,1)}
  shake*=.87;flash*=.9;
  for(let i=this.ft.length-1;i>=0;i--){const f=this.ft[i];f.y-=.65;if(--f.t<=0)this.ft.splice(i,1)}
  if(this.banner&&--this.banner.t<=0)this.banner=null;

  if(this.state=='MENU'){this.cam.x+=.6;return}
  if(this.state!='PLAY'||!this.L)return;

  const p=P,L=this.L;

  for(const m of this.mps){
    const ox=m.x,oy=m.y;
    m[m.ax]+=m.sp*m.dir;
    const v=m[m.ax];
    if(v>m.hi||v<m.lo){m.dir*=-1;m[m.ax]=clamp(v,m.lo,m.hi)}
    m.dx=m.x-ox;m.dy=m.y-oy;
  }
  if(p.ride){p.x+=p.ride.dx;p.y+=p.ride.dy;p.ride=null}

  const lf=K.l||T.l, rt=K.r||T.r, jh=K.j||T.j;
  const tg=(lf?-1:0)+(rt?1:0);
  if(tg)p.face=tg;

  if(p.dcd>0)p.dcd--;
  if(p.scd>0)p.scd--;
  if(p.ifr>0)p.ifr--;
  if(p.shield>0){p.shield--;if(p.shield==0)this.syncHud()}
  if(p.recoil>0)p.recoil--;

  if(p.dreq){p.dreq=0;if(p.dcd<=0&&p.dash<=0){p.dash=10;p.dcd=52;A.dash();emit(p.x+13,p.y+18,12,CH[this.ci].c,4,4)}}
  if(p.sreq){p.sreq=0;this.shoot()}

  if(p.dash>0){
    p.dash--;p.vx=p.face*14.5;p.vy=0;
    if(this.t%2==0)emit(p.x+13,p.y+18,2,CH[this.ci].c,1.6,5);
  }else{
    if(p.lock>0){p.lock--;p.vx*=.9}
    else p.vx+=(tg*p.sp-p.vx)*(p.gr?.36:.24);
  }

  if(p.dash<=0)p.vy=Math.min(p.vy+p.grV,15.5);

  if(p.wall&&!p.gr&&p.vy>2.4&&tg==p.wall){
    p.vy=Math.min(p.vy,2.4);
    if(this.t%4==0)emit(p.x+(p.wall>0?p.w:0),p.y+12,1,'#9ad',1,2);
  }

  p.coy=p.gr?7:Math.max(0,p.coy-1);
  if(p.buf>0)p.buf--;
  if(p.buf>0){
    if(p.coy>0){
      p.vy=-p.jp;p.coy=0;p.buf=0;p.jumping=true;p.sq=-.28;A.jump();
      emit(p.x+13,p.y+36,10,CH[this.ci].c,3,3);
    }else if(p.wall&&!p.gr){
      p.vy=-p.jp*.84;p.vx=-p.wall*7.2;p.lock=11;p.face=-p.wall;p.buf=0;p.jumping=true;A.jump();
      emit(p.x+(p.wall>0?p.w:0),p.y+18,10,'#fff',3.5,3);
    }else if(p.dj>0){
      p.dj=0;p.vy=-p.jp*.79;p.buf=0;p.jumping=true;A.jump();
      emit(p.x+13,p.y+36,16,'#ffd23f',3.5,3);ring(p.x+13,p.y+30,30,'#ffd23f');
    }
  }
  if(!jh&&p.jumping&&p.vy<-4){p.vy*=.52;p.jumping=false}

  const all=this.sol.concat(this.mps);
  p.x+=p.vx;p.wall=0;
  this.col(all,'x');
  if(p.wall)p.dj=1;

  const wasGr=p.gr,pv=p.vy;
  p.gr=false;p.y+=p.vy;
  this.col(all,'y');
  if(p.gr){
    p.dj=1;p.jumping=false;
    if(!wasGr&&pv>5){p.sq=.32;emit(p.x+13,p.y+36,8,'#9aa0c8',2.4,3)}
  }

  p.sq*=.82;p.rot+=p.vx*.075;
  if(Math.abs(p.vx)>1&&p.gr&&this.t%7==0)emit(p.x+13,p.y+36,1,'#6677aa',1,3);
  p.tr.push({x:p.x,y:p.y,a:.45});if(p.tr.length>9)p.tr.shift();
  for(const q of p.tr)q.a*=.8;

  for(const e of this.en){
    if(!e.alive)continue;
    e.tt=(e.tt||0)+1;
    if(e.flash>0)e.flash--;

    if(e.t=='w'){
      e.x+=e.sp*e.dir;
      if(e.x>e.hi){e.x=e.hi;e.dir=-1}
      if(e.x<e.lo){e.x=e.lo;e.dir=1}
    }
    else if(e.t=='d'){
      const dx=(p.x+13)-(e.x+e.w/2), dy=(p.y+18)-(e.y+e.h/2), d=Math.hypot(dx,dy)||1;
      if(d<460){e.x+=(dx/d)*1.8;e.y+=(dy/d)*1.4;e.dir=dx>0?1:-1}
      else{e.y=e.y0+Math.sin(e.tt/22)*18;e.x+=Math.sin(e.tt/60)*0.4}
      e.x=clamp(e.x,e.lo-100,e.hi+100);
      e.y=Math.max(-300,Math.min(e.gy-e.h+40,e.y));
    }
    else if(e.t=='h'){
      e.cd=(e.cd||0)-1;
      if(e.vy===undefined)e.vy=0;
      const onG=e.y>=e.gy-e.h-1;
      if(onG){
        e.vy=0;e.vx*=0.5;
        if(e.cd<=0){
          e.cd=50+Math.random()*40;
          const dir=Math.sign((p.x+13)-(e.x+e.w/2))||1;
          e.vx=dir*4.2;e.vy=-11;
        }
      }
      e.vy+=0.55;e.x+=(e.vx||0);e.y+=e.vy;
      if(e.y>=e.gy-e.h){e.y=e.gy-e.h;e.vy=0}
      e.x=clamp(e.x,e.lo-30,e.hi+30);
      if((e.vx||0)>0)e.dir=1;else if((e.vx||0)<0)e.dir=-1;
    }
    else if(e.t=='s'){
      e.cd=(e.cd||0)+1;
      const dx=(p.x+13)-(e.x+e.w/2), dy=(p.y+18)-(e.y+14);
      const dist=Math.hypot(dx,dy);
      if(e.cd>90&&dist<560){
        e.cd=0;
        const a=Math.atan2(dy,dx);
        this.bul.push({x:e.x+e.w/2,y:e.y+14,vx:Math.cos(a)*5.2,vy:Math.sin(a)*5.2,l:240,col:'#ffb21f'});
        A.t('square',320,130,.12,.09);
      }
      e.dir=(p.x+13)>(e.x+e.w/2)?1:-1;
    }
    else if(e.t=='t'){
      e.x+=e.sp*e.dir;
      if(e.x>e.hi){e.x=e.hi;e.dir=-1}
      if(e.x<e.lo){e.x=e.lo;e.dir=1}
      if(e.tt%140==0&&Math.abs((p.x+13)-(e.x+e.w/2))<560){
        const dx=(p.x+13)-(e.x+e.w/2), dy=(p.y+18)-(e.y+20);
        const a=Math.atan2(dy,dx);
        this.bul.push({x:e.x+e.w/2,y:e.y+20,vx:Math.cos(a)*4.4,vy:Math.sin(a)*4.4,l:260,col:'#a64dff',size:8});
        A.t('square',260,90,.16,.12);
      }
    }

    if(hit(p,e)){
      const stomp=p.vy>0&&p.y+p.h-p.vy<=e.y+16;
      if(p.dash>0){this.dmgEnemy(e,3,p.x-e.x,p.y-e.y);p.vx=-p.face*7;p.dash=0}
      else if(stomp){this.dmgEnemy(e,2,0,0);p.vy=-10.6;p.dj=1;p.jumping=false;A.bounce()}
      else{this.damagePlayer(1,(p.x<e.x?-1:1)*7,-6);if(this.state!='PLAY')return}
    }
  }

  if(this.upd2())return;

  for(const s of this.sp)if(hit(p,s.hb)){this.damagePlayer(2,(p.x<s.x?-1:1)*9,-9);if(this.state!='PLAY')return;break}

  for(const d of this.pads){
    if(d.a>0)d.a--;
    if(p.vy>=0&&hit(p,{x:d.x,y:d.y,w:d.w,h:d.h})){
      p.vy=-18.5;p.jumping=false;d.a=14;A.bounce();
      emit(d.x+22,d.y,18,'#ff2bd6',4.5,4);ring(d.x+22,d.y+10,44,'#ff2bd6');
    }
  }

  for(const c of this.cn){
    if(c.got)continue;
    if(hit(p,{x:c.x-11,y:c.y-11,w:22,h:22})){
      c.got=true;this.coins++;A.coin();
      emit(c.x,c.y,14,'#ffd23f',3.5,3);
      this.syncHud();
    }
  }

  for(let i=this.drops.length-1;i>=0;i--){
    const d=this.drops[i];
    d.bob+=.06;
    if(d.vy!==undefined){d.vy+=.5;d.y+=d.vy}
    if(hit(p,{x:d.x-18,y:d.y-18,w:36,h:36})){
      if(d.t=='weapon'){
        P.wp=d.wp;P.ammo[d.wp]=Math.min(P.ammo[d.wp]===Infinity?99:P.ammo[d.wp]+30,99);
        if(WPN[d.wp].inf)P.ammo[d.wp]=Infinity;
        A.pickup();this.ft.push({s:'سلاح جديد!',x:d.x,y:d.y-26,t:80,c:WPN[d.wp].c,sz:22});
        emit(d.x,d.y,22,WPN[d.wp].c,5,4);
      }else if(d.t=='ammo'){
        for(let k=0;k<WPN.length;k++)if(!WPN[k].inf)P.ammo[k]=Math.min(P.ammo[k]+8,99);
        A.pickup();this.ft.push({s:'ذخيرة',x:d.x,y:d.y-26,t:60,c:'#ffd23f',sz:20});
      }else{
        P.hp=Math.min(P.maxhp,P.hp+1);A.pickup();
        this.ft.push({s:'علاج',x:d.x,y:d.y-26,t:60,c:'#2bffb0',sz:20});
        emit(d.x,d.y,18,'#2bffb0',4,4);
      }
      this.drops.splice(i,1);this.syncHud();continue;
    }
    if(d.t!='weapon'&&d.vy!==undefined&&d.y>800)this.drops.splice(i,1);
  }

  for(const c of this.cps){
    if(!c.on&&p.gr&&Math.abs(p.x+13-c.x)<46&&Math.abs(p.y+36-c.y)<80){
      c.on=true;this.cpPos={x:c.x,y:c.y-70};
      this.ft.push({s:'نقطة حفظ',x:c.x,y:c.y-80,t:80,c:'#2bffb0',sz:22});
      emit(c.x,c.y-40,20,'#2bffb0',4,4);A.pickup();
    }
  }

  if(this.po.on&&hit(p,this.po))return this.win();
  if(p.y>1100)return this.die();

  const VW=W/Z,VH=H/Z;
  this.cam.x+=(Math.max(L.minX,Math.min(L.maxX-VW,p.x+13-VW/2+p.face*45))-this.cam.x)*.11;
  this.cam.y+=(Math.min(p.y+18-VH*(VH>VW?.6:.5),280)-this.cam.y)*.1;
};

G.upd2=function(){
  const p=P,b=this.bs,ar=this.L.ar;

  for(const o of this.bol){
    if(!o.homing)continue;
    let best=null,bd=1e9;
    for(const e of this.en){if(!e.alive)continue;
      const d=Math.hypot(e.x+e.w/2-o.x,e.y+e.h/2-o.y);
      if(d<bd){bd=d;best={x:e.x+e.w/2,y:e.y+e.h/2}}
    }
    if(!best&&b&&b.alive&&b.act){
      const d=Math.hypot(b.x+b.w/2-o.x,b.y+b.h/2-o.y);
      if(d<bd){bd=d;best={x:b.x+b.w/2,y:b.y+b.h/2}}
    }
    if(best){
      const dx=best.x-o.x,dy=best.y-o.y,d=Math.hypot(dx,dy)||1;
      o.vx=o.vx*.92+(dx/d)*9*.08;
      o.vy=o.vy*.92+(dy/d)*9*.08;
    }
  }

  for(let i=this.bol.length-1;i>=0;i--){
    const o=this.bol[i];
    o.x+=o.vx;o.y+=o.vy;
    if(o.grav)o.vy+=o.grav;
    if(this.t%2==0)PT.push({x:o.x,y:o.y,vx:rnd(-.4,.4),vy:rnd(-.4,.4),s:o.r*1.4,col:o.col,a:.55,d:.05,g:0});
    const bx={x:o.x-o.r,y:o.y-o.r,w:o.r*2,h:o.r*2};
    let dead=--o.l<=0;
    if(!dead)for(const s of this.sol)if(hit(bx,s)){dead=true;break}
    if(!dead)for(const m of this.mps)if(hit(bx,m)){dead=true;break}
    if(!dead){
      for(const e of this.en){if(!e.alive)continue;
        if(hit(bx,e)){this.dmgEnemy(e,o.dmg,o.vx,o.vy);if(o.pierce>0)o.pierce--;else dead=true;break}
      }
    }
    if(!dead&&b&&b.alive&&b.act&&hit(bx,b)){
      this.hurtBoss(o.dmg);if(o.pierce>0)o.pierce--;else dead=true;
    }
    if(dead){
      if(o.explode)boom(o.x,o.y,o.explode,o.dmg,o.col);
      else emit(o.x,o.y,6,o.col,2.4,3);
      this.bol.splice(i,1);
    }
  }

  if(b&&!b.act&&p.x>ar.x-260){b.act=true;this.banner={t:140,s:'⚠ الزعيم: '+b.n};shake=8}

  if(b&&b.alive&&b.act){
    b.t++;b.mt++;
    if(b.flash>0)b.flash--;
    if(b.inv>0)b.inv--;
    if(!b.rg&&b.hp<=b.max*.42){
      b.rg=true;this.banner={t:110,s:'غضب الزعيم!'};shake=15;flash=.5;
      A.t('sawtooth',100,420,.45,.25);emit(b.x+b.w/2,b.y+b.h/2,40,b.c,7,5);
    }
    const spd=(1.4+this.li*.32)*(b.rg?1.6:1);
    const onGround=b.y+b.h>=b.gy-.5;

    if(b.m==0){
      b.vx=Math.sign(p.x-b.x)*spd;b.dir=Math.sign(b.vx)||b.dir;
      const fireRate=b.rg?46:Math.max(58,130-this.li*8);
      if(b.t%fireRate==0){
        const cnt=b.rg?5:(this.li>=4?3:1);
        const an=Math.atan2(p.y+18-(b.y+34),p.x+13-(b.x+b.w/2));
        for(let k=0;k<cnt;k++){
          const a=an+(k-(cnt-1)/2)*.26;
          this.bul.push({x:b.x+b.w/2,y:b.y+34,vx:Math.cos(a)*4.4,vy:Math.sin(a)*4.4,l:260,col:b.c});
        }
        A.t('square',300,120,.14,.11);
      }
      if(b.mt>150&&this.li>0){b.m=1;b.mt=0;b.vx=0}
      if(this.li>=3&&b.mt>100&&Math.random()<.012){b.m=2;b.mt=0;b.vy=-13}
    }else if(b.m==1){
      b.vx=0;
      if(b.mt==16){b.vx=b.dir*(7.5+this.li*.45);A.dash();shake=6}
      if(b.mt>52){b.m=0;b.mt=0;b.vx=0}
    }else{
      b.vx=0;
      if(onGround&&b.vy>=0&&b.mt>8){
        b.m=0;b.mt=0;shake=14;
        emit(b.x+b.w/2,b.y+b.h,32,b.c,7,5);ring(b.x+b.w/2,b.y+b.h,120,b.c);
        for(let k=-2;k<=2;k++)this.bul.push({x:b.x+b.w/2,y:b.y+b.h-10,vx:k*2.6,vy:-3.4,l:200,col:b.c});
        A.explode();
      }
    }

    b.x=clamp(b.x+b.vx,b.lo,b.hi);
    b.vy+=.58;b.y+=b.vy;
    if(b.y+b.h>=b.gy){b.y=b.gy-b.h;if(b.vy>8)shake=Math.max(shake,8);b.vy=0}

    if(hit(p,b)){
      if(p.dash>0){this.hurtBoss(2);p.dash=0;p.vx=-p.face*7;p.vy=-5}
      else if(p.vy>0&&p.y+p.h-p.vy<=b.y+30){this.hurtBoss(1);p.vy=-11.8;p.dj=1;p.jumping=false;A.bounce()}
      else{this.damagePlayer(1,(p.x<b.x?-1:1)*10,-7);if(this.state!='PLAY')return true}
    }
  }

  for(let i=this.bul.length-1;i>=0;i--){
    const o=this.bul[i];
    o.x+=o.vx;o.y+=o.vy;o.l--;
    const bx={x:o.x-6,y:o.y-6,w:12,h:12};
    let dead=o.l<=0;
    if(!dead)for(const s of this.sol)if(hit(bx,s)){dead=true;break}
    if(!dead&&p.dash<=0&&hit(bx,p)){
      this.damagePlayer(1,o.vx*.7,-4);dead=true;
      if(this.state!='PLAY')return true;
    }
    if(dead){emit(o.x,o.y,4,o.col||'#ff2255',2,2.4);this.bul.splice(i,1)}
  }
  return false;
};

G.col=function(all,ax){
  const p=P;
  for(const s of all){
    if(!hit(p,s))continue;
    if(ax=='x'){
      const d=p.vx!==0?p.vx:(p.x+p.w/2<s.x+s.w/2?1:-1);
      if(d>0){p.x=s.x-p.w;p.wall=1}else{p.x=s.x+s.w;p.wall=-1}
      p.vx=0;
    }else if(p.vy>0){
      p.y=s.y-p.h;p.gr=true;p.vy=0;
      if(s.sp)p.ride=s;
    }else if(p.vy<0){
      p.y=s.y+s.h;p.vy=0;
    }
  }
};

G.render=function(){
  const VW=W/Z,VH=H/Z,t=this.t;
  X.setTransform(DPR*Z,0,0,DPR*Z,0,0);
  X.clearRect(0,0,VW,VH);
  const th=theme(this.L?this.li:this.un%NL);
  this.bg(VW,VH,th,t);

  if(this.L){
    X.save();
    X.translate(-this.cam.x+(Math.random()-.5)*shake,-this.cam.y+(Math.random()-.5)*shake);

    for(const s of this.sp){
      X.shadowColor='#ff2255';X.shadowBlur=10;X.fillStyle='#ff2255';
      const n=Math.floor(s.w/20);
      for(let i=0;i<n;i++){
        X.beginPath();
        X.moveTo(s.x+i*20,s.y+20);

      X.shadowColor='#ff2bd6';X.shadowBlur=14;
      X.fillStyle='#ff2bd6';X.fillRect(d.x+4,d.y+14+(1-c)*8,d.w-8,6);
      X.shadowBlur=0;
      X.strokeStyle='#ff8cf0';X.lineWidth=2;
      for(let i=0;i<2;i++){const o=((t/6+i*5)%10);
        X.globalAlpha=1-o/10;X.beginPath();
        X.moveTo(d.x+14,d.y+10-o);X.lineTo(d.x+22,d.y-o);X.lineTo(d.x+30,d.y+10-o);X.stroke()}

    }

    this.cn.forEach((c,i)=>{

      X.shadowColor='#ffd23f';X.shadowBlur=14;
      X.fillStyle='#ffd23f';X.beginPath();X.ellipse(c.x,y,9*Math.abs(sx)+1.5,9,0,0,6.283);X.fill();
      X.shadowBlur=0;
      X.fillStyle='#fff7c0';X.beginPath();X.ellipse(c.x,y,4*Math.abs(sx),5,0,0,6.283);X.fill();
    });

    for(const d of this.drops){

        X.strokeStyle=col;X.lineWidth=2.5;X.stroke();

      }else if(d.t=='ammo'){

        X.shadowBlur=0;X.fillStyle='#050514';X.fillRect(d.x-6,y-2,12,4);X.fillRect(d.x-2,y-6,4,12);
      }else{
        X.shadowColor='#2bffb0';X.shadowBlur=12;

        X.shadowBlur=0;
      }
    }

    const o=this.po,px=o.x+o.w/2,py=o.y+o.h/2;

    const pg=X.createRadialGradient(px,py,4,px,py,80);
    pg.addColorStop(0,'rgba(43,255,176,.55)');pg.addColorStop(1,'rgba(43,255,176,0)');
    X.fillStyle=pg;X.fillRect(px-90,py-90,180,180);
    X.shadowColor='#2bffb0';X.shadowBlur=20;
    X.strokeStyle='#2bffb0';X.lineWidth=3;
    for(let i=0;i<3;i++){
      X.globalAlpha=(1-i*.27)*(o.on?1:.3);
      X.beginPath();X.ellipse(px,py,26-i*6+Math.sin(t/15+i)*2,48-i*9,0,0,6.283);X.stroke();
    }
    X.globalAlpha=1;X.shadowBlur=0;

    for(const e of this.en){if(e.alive)this.mon(e,t)}

    const b=this.bs;
    if(b&&b.alive)this.boss(b,t);

    for(const o2 of this.bul){
      X.shadowColor=o2.col||'#ff2255';X.shadowBlur=12;
      X.fillStyle=o2.col||'#ff4d79';X.beginPath();X.arc(o2.x,o2.y,6.5,0,6.283);X.fill();

      X.shadowBlur=0;
    }
    for(const o2 of this.bol){
      X.shadowColor=o2.col;X.shadowBlur=14;
      X.fillStyle=o2.col;
      if(o2.explode){X.beginPath();X.arc(o2.x,o2.y,7,0,6.283);X.fill();
        X.fillStyle='#fff';X.beginPath();X.arc(o2.x,o2.y,3,0,6.283);X.fill()}
      else if(o2.pierce)X.fillRect(o2.x-14,o2.y-2.5,28,5);
      else X.fillRect(o2.x-8,o2.y-3,16,6);
      X.shadowBlur=0;
    }

    for(const r of RINGS){
      X.globalAlpha=Math.max(0,r.a);X.strokeStyle=r.col;X.lineWidth=3;
      X.beginPath();X.arc(r.x,r.y,r.r,0,6.283);X.stroke();
    }
    X.globalAlpha=1;

    const ch=CH[this.ci];
    if(this.state!='DEAD'){
      for(const q of P.tr){
        X.globalAlpha=q.a*.45;X.fillStyle=ch.c;
        X.fillRect(q.x+3,q.y+3,20,30);
      }
      X.globalAlpha=1;
      const blink=P.ifr>0&&this.t%8<4;
      if(!blink){
        X.save();
        X.translate(P.x+13-P.face*P.recoil*.8,P.y+18);
        const sy=1+P.sq;
        X.scale(P.face*(1/sy),sy);
        X.shadowColor=ch.c;X.shadowBlur=18;
        if(P.shield>0){
          X.strokeStyle='#00f0ff';X.lineWidth=2;X.globalAlpha=.5+Math.sin(this.t/6)*.3;
          X.beginPath();X.arc(0,0,26,0,6.283);X.stroke();X.globalAlpha=1;
        }
        ch.d(X,this.t,P.gr?Math.sin(this.t*.4)*3*Math.min(1,Math.abs(P.vx)/3):(P.vy<0?-3:3),P.rot);
        const w=WPN[P.wp];
        X.shadowColor=w.c;X.shadowBlur=12;X.fillStyle=w.c;
        X.fillRect(6,-3.5,18,7);
        X.fillStyle='#0a0a20';X.fillRect(9,-1.5,13,3);
        X.fillStyle=w.c;X.fillRect(2,-5,7,10);
        X.restore();
      }
      X.shadowBlur=0;
    }

    X.globalCompositeOperation='lighter';
    for(const p of PT){
      X.globalAlpha=Math.max(0,p.a);X.fillStyle=p.col;
      X.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);
    }
    X.globalAlpha=1;X.globalCompositeOperation='source-over';

    for(const f of this.ft){
      X.globalAlpha=Math.min(1,f.t/30);
      X.font=`900 ${f.sz||26}px Cairo,sans-serif`;X.textAlign='center';
      X.fillStyle=f.c;X.shadowColor=f.c;X.shadowBlur=12;
      X.fillText(f.s,f.x,f.y);
    }
    X.globalAlpha=1;X.shadowBlur=0;
    X.restore();
  }

  const b=this.bs;
  if(b&&b.alive&&b.act){
    const w=Math.min(440,VW-40),x=(VW-w)/2;
    X.fillStyle='rgba(8,6,28,.82)';X.beginPath();X.roundRect(x-2,60,w+4,20,6);X.fill();
    X.fillStyle=b.c;
    X.fillRect(x+2,62,(w-4)*Math.max(0,b.hp)/b.max,16);
    X.font='700 13px Cairo,sans-serif';X.textAlign='center';X.fillStyle='#fff';
    X.fillText(tr('الزعيم: ')+(LANG=='en'?BNE[this.li]:b.n),VW/2,54);
  }

  if(this.banner){
    const bn=this.banner;
    X.globalAlpha=Math.min(1,bn.t/30,(150-bn.t)/22);

    X.fillStyle='#fff';X.shadowColor='#00f0ff';X.shadowBlur=22;
    X.fillText(bn.s,VW/2,VH*.28);
    X.shadowBlur=0;X.globalAlpha=1;
  }

  if(flash>.01){
    X.globalAlpha=Math.min(.6,flash);
    X.fillStyle='#ff2255';X.fillRect(0,0,VW,VH);
    X.globalAlpha=1;
  }
};

G.bg=function(VW,VH,th,t){
  const cx=this.cam.x,cy=this.cam.y||0;
  const g=X.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,th.sky[0]);g.addColorStop(.55,th.sky[1]);g.addColorStop(1,th.sky[2]);
  X.fillStyle=g;X.fillRect(0,0,VW,VH);

  for(const s of ST){
    const x=(((s.x-cx*.03)%VW)+VW)%VW, y=(s.y*VH/600)-cy*.01;
    if(y<-10||y>VH+10)continue;
    X.globalAlpha=.35+.65*Math.abs(Math.sin(t/40+s.p));
    X.fillStyle='#fff';X.fillRect(x,y,s.s,s.s);
  }
  X.globalAlpha=1;

  const sx=VW*.72-cx*.02, sy=VH*.46;
  const rg=X.createRadialGradient(sx,sy,10,sx,sy,140);
  rg.addColorStop(0,th.n1);rg.addColorStop(.5,th.n2);rg.addColorStop(1,'rgba(0,0,0,0)');
  X.globalAlpha=.55;X.fillStyle=rg;X.beginPath();X.arc(sx,sy,140,0,6.283);X.fill();
  X.globalAlpha=1;

  [[.13,th.city,th.n1],[.32,'rgba(10,6,34,.95)',th.n2]].forEach(([par,fc,ec],l)=>{
    const base=VH*(l?.99:.92)-cy*par*.28, off=cx*par;
    for(const bd of SK[l])for(const k of [0,1]){
      const x=((bd.x-off)%3600+3600)%3600-(k?3600:0);
      if(x>VW||x+bd.w<0)continue;
      X.fillStyle=fc;X.fillRect(x,base-bd.h,bd.w,bd.h+400);
      X.fillStyle=ec;X.globalAlpha=.7;X.fillRect(x,base-bd.h,bd.w,2);
      X.globalAlpha=1;
      if(l)for(let wy=base-bd.h+10;wy<base-4;wy+=16)for(let wx=x+6;wx<x+bd.w-8;wx+=13){
        const o=Math.sin(wx*12.9+wy*7.1+bd.s*99)>.15;
        if(o){X.globalAlpha=.5;X.fillStyle=(wx+wy)%3<1?th.n2:th.n1;X.fillRect(wx,wy,5,7)}
      }
      X.globalAlpha=1;
    }
  });
};

G.plat=function(x,y,w,h,c,moving){

G.mon=function(e,t){

      X.lineTo(Math.cos(a)*20,Math.sin(a)*20);X.lineTo(Math.cos(a+.2)*12,Math.sin(a+.2)*12);X.fill()}
    X.fillStyle='#050514';X.fillRect(-8,-5,16,7);

  }else{
    const l=Math.sin(t*.25+e.lo*.1)*4;

G.boss=function(b,t){

    X.moveTo(0,-b.h/2);X.lineTo(b.w/2,0);X.lineTo(0,b.h/2);X.lineTo(-b.w/2,0);

    X.shadowColor='#ff2bd6';X.shadowBlur=20;
    X.fillStyle='#ff2bd6';X.beginPath();X.arc(0,-b.h/2-16,8+Math.sin(t/8)*2,0,6.283);X.fill();

(function(){

  /* الأسعار الجديدة */
  const PRICES = {
    weapon5: 400,   // كان 40
    hp: 500,        // كان 30
    skin1: 150,     // كان 20
    skin2: 200,     // كان 20
    skin3: 250      // كان 30
  };

  /* استبدال دالة الشراء */
  G.buy = function(item){
    const price = PRICES[item];
    const un = this.unlocks = this.unlocks || {};

    /* لو مملوك: تبديل السكن */
    if(un[item]){
      if(item.startsWith('skin')){
        this.skin = (this.skin === item) ? '' : item;
        sv('skin', this.skin);
        A.pickup();
        this.shop();
      }
      return;
    }

    /* لو مش في القائمة (زي skinGold) اخرج */
    if(!price) return;

    /* مش كفاية */
    if((this.totalCoins||0) < price){
      A.t('square', 200, 100, .2, .15);
      flash = .3;
      return;
    }

    /* خصم + تفعيل */
    this.totalCoins -= price;
    sv('totalCoins', this.totalCoins);
    un[item] = true;
    sv('unlocks', this.unlocks);
    A.pickup();
    flash = .4;

    if(item.startsWith('skin')){
      this.skin = item;
      sv('skin', this.skin);
    }
    if(item === 'weapon5'){
      if(!WPN.find(w=>w.k==='5')){
        WPN.push({k:'5',n:'صاروخ موجه',e:'Homing',c:'#ff6600',
          cd:55,dmg:3,spd:9,r:6,homing:true,start:5,sfx:'launch'});

    const un = this.unlocks || {};

      {id:'skin1', name:'نيون أخضر', color:'#2bffb0', price:PRICES.skin1},

      {id:'skin3', name:'أحمر ناري', color:'#ff2255', price:PRICES.skin3}

      <div class="card ${this.skin==='skinGold'?'on':''} gold-skin" onclick="G.buy('skinGold')" style="border-color:#ffd23f">

      <h2 style="color:#ffd23f">💰 المتجر</h2>
      <p class="sub">رصيدك: <b style="color:#ffd23f;font-size:20px">${tc} 🪙</b></p>

          <span>سلاح 5: صاروخ موجه</span>

        </div>
        <div class="card ${un.hp?'on':''}" onclick="G.buy('hp')">

/* ═══════════════════════════════════════════════
   DEVICE MODE SELECTOR — كمبيوتر / هاتف / تلقائي
   ═══════════════════════════════════════════════ */
(function(){

  /* الوضع المحفوظ */
  G.deviceMode = ld('deviceMode', 'auto');

  /* هل نعرض أزرار اللمس؟ */
  function shouldShowTouch(){
    if(G.deviceMode === 'desktop') return false;
    if(G.deviceMode === 'mobile')  return true;
    return 'ontouchstart' in window || matchMedia('(pointer:coarse)').matches;
  }

  /* Override hud() لاحترام الوضع */
  const _hud = G.hud;
  G.hud = function(on){
    $('hud').classList.toggle('hide', !on);
    const showTouch = on && shouldShowTouch();
    $('tc').classList.toggle('hide', !showTouch);
  };

  /* تغيير الوضع */
  G.setDevice = function(mode){
    G.deviceMode = mode;
    sv('deviceMode', mode);
    A.pickup();
    if(G.state === 'PLAY') G.hud(1);
    G.menu();
  };

  /* إضافة الأزرار في القائمة */
  const _menu = G.menu;
  G.menu = function(){
    _menu.call(this);
    setTimeout(()=>{
      const scr = document.querySelector('#ui .scr');
      if(!scr || scr.querySelector('.device-row')) return;

      const w = document.createElement('div');
      w.className = 'device-row';
      w.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%;max-width:520px;margin:4px 0';

      const opts = [
        {id:'desktop', label:'🖥️ كمبيوتر', color:'#00f0ff'},
        {id:'mobile',  label:'📱 هاتف',     color:'#2bffb0'},
        {id:'auto',    label:'🔄 تلقائي',   color:'#ffd23f'}
      ];

      opts.forEach(o=>{
        const b = document.createElement('button');
        b.className = 'btn device-btn';
        const active = G.deviceMode === o.id;
        b.style.cssText = `background:${active?o.color:'rgba(8,6,28,.8)'};color:${active?'#021018':o.color};font-weight:900;border:2px solid ${o.color};font-size:12px;padding:7px 12px;min-width:0;border-radius:11px;cursor:pointer`;
        b.textContent = o.label;
        b.onclick = ()=> G.setDevice(o.id);
        w.appendChild(b);
      });

      /* حطها بعد صف الصعوبة لو موجود، وإلا بعد صف أوضاع اللعب */
      const diffRow = scr.querySelector('.diff-btn')?.parentNode;
      const modesRow = scr.querySelector('.mode-btn')?.parentNode;
      const ref = diffRow || modesRow;
      if(ref && ref.parentNode) ref.parentNode.insertBefore(w, ref.nextSibling);
      else scr.appendChild(w);
    }, 120);
  };

  /* تطبيق الوضع فوراً عند بدء اللعب */
  const _start = G.start;
  G.start = function(i, useCp){
    _start.call(this, i, useCp);
    this.hud(1); // يعيد التحقق من الوضع
  };

  /* تحديث القائمة */
  setTimeout(()=>{ try{ if(G.state==='MENU') G.menu(); }catch(e){} }, 300);

  console.log('✅ Device mode selector loaded');

})();

/* ═══════════════════════════════════════════════
   ENEMY DEATH VOICE — صوت "سوف أنتقم"
   ═══════════════════════════════════════════════ */
(function(){

  /* === اختيار الصوت الأنسب === */
  let arVoice = null;
  function pickVoice(){
    if(!('speechSynthesis' in window)) return;
    const voices = speechSynthesis.getVoices();
    /* دور على صوت عربي */
    arVoice = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('ar'))
           || voices.find(v=>v.name && /arab|hoda|naayf|majed/i.test(v.name))
           || null;
  }
  if('speechSynthesis' in window){
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }

  /* === عبارات الانتقام (متنوعة عشان مش كل مرة نفس الكلمة) === */
  const PHRASES = [
    'سوف أنتقم',
    'سوف أنتقم منك',
    'لن تفلت مني',
    'سأعود أقوى',
    'ستدفع الثمن',
    'هذا ليس النهاية'
  ];
  const PHRASES_EN = [
    'I will take revenge',
    'I will return',
    'You will pay',
    'This is not the end',
    'I will be back',
    'Revenge is coming'
  ];

  /* === نطق جملة === */
  let lastSpeak = 0;
  function speakRevenge(){
    /* منع التكرار السريع */
    const now = Date.now();
    if(now - lastSpeak < 1200) return;
    lastSpeak = now;

    /* 1. لو الكلام متاح → استخدمه */
    if('speechSynthesis' in window && A.on){
      try{
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance();
        const phrase = LANG === 'en'
          ? PHRASES_EN[Math.floor(Math.random()*PHRASES_EN.length)]
          : PHRASES[Math.floor(Math.random()*PHRASES.length)];
        u.text = phrase;
        u.lang = LANG === 'en' ? 'en-US' : 'ar-SA';
        u.rate = 0.85;
        u.pitch = 0.6;
        u.volume = 0.65;
        if(arVoice && LANG !== 'en') u.voice = arVoice;
        speechSynthesis.speak(u);
      }catch(e){}
    }

    /* 2. صوت احتياطي دايماً (whisper effect) */
    try{
      const c = A.c;
      if(!c) return;
      if(c.state === 'suspended') c.resume();
      const t0 = c.currentTime;
      /* whisper: noise مع فلتر */
      const buf = c.createBuffer(1, c.sampleRate * 0.8, c.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<d.length;i++){
        const env = Math.sin((i/d.length) * Math.PI);
        d[i] = (Math.random()*2-1) * env * Math.pow(1 - i/d.length, 1.5);
      }
      const src = c.createBufferSource();
      src.buffer = buf;
      const bp = c.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 450;
      bp.Q.value = 2.5;
      const g = c.createGain();
      g.gain.value = 0.35;
      src.connect(bp); bp.connect(g); g.connect(A.m);
      src.start(t0);

      /* نغمة منخفضة شريرة */
      const o = c.createOscillator();
      const og = c.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(90, t0);
      o.frequency.exponentialRampToValueAtTime(55, t0 + 0.7);
      og.gain.setValueAtTime(0.001, t0);
      og.gain.linearRampToValueAtTime(0.12, t0 + 0.1);
      og.gain.exponentialRampToValueAtTime(0.001, t0 + 0.7);
      o.connect(og); og.connect(A.m);
      o.start(t0); o.stop(t0 + 0.75);
    }catch(e){}
  }

  /* === Hook على موت العدو === */
  const _dmgEnemy = G.dmgEnemy;
  G.dmgEnemy = function(e, n, dx, dy){
    const wasAlive = e.alive;
    _dmgEnemy.call(this, e, n, dx, dy);
    /* لو مات دلوقتي */
    if(wasAlive && !e.alive){
      speakRevenge();
      /* نص يطير فوق مكان الموت */
      this.ft.push({
        s: LANG === 'en' ? '💀 I will avenge!' : '💀 سوف أنتقم!',
        x: e.x + e.w/2,
        y: e.y - 20,
        t: 80,
        c: '#ff2255',
        sz: 20
      });
    }
  };

  /* === Hook على موت الزعيم (نسخة أقوى) === */
  const _bossDie = G.bossDie;
  G.bossDie = function(){
    _bossDie.call(this);
    /* صوت الزعيم آخر شيء */
    lastSpeak = 0;
    setTimeout(()=>{
      speakRevenge();
      /* نص كبير */
      if(this.bs){
        this.ft.push({
          s: LANG === 'en' ? '💀 I WILL TAKE REVENGE!' : '💀 سوف أنتقم!',
          x: this.bs.x + this.bs.w/2,
          y: this.bs.y - 40,
          t: 140,
          c: '#ff2bd6',
          sz: 34
        });
      }
    }, 400);
  };

  /* === تأكد إن الصوت بيتحمل أول مرة === */
  A.init && (()=>{
    const origInit = A.init.bind(A);
    A.init = function(){
      origInit();
      /* إعادة تحميل الأصوات بعد التهيئة */
      setTimeout(pickVoice, 100);
    };
  })();

  console.log('🗣️ Revenge voice loaded');

})();

    'كح كح':'Öhö öhö','المرحلة':'Seviye','المراحل':'Seviyeler','العودة':'Geri','اختيار':'Seç',
    'متابعة':'Devam','العملات':'Paralar','الزعيم':'Patron','الصوت':'Ses','مفعل':'Açık','معطل':'Kapalı',
    'متاحة':'Açık','مغلقة':'Kilitli','إيقاف':'Duraklat','اندفاع':'Atılım','طلقة':'Ateş','قفز':'Zıpla',
    'آآه~':'Aaah~','المكوك النيون':'Neon Mech','نبضة':'Nabız','شوزن':'Saçma','ليزر':'Lazer',
    'قنبلة بلازما':'Plazma Bombası','سلاح جديد!':'Yeni Silah!','ذخيرة':'Mühimmat','علاج':'İlaç','درع':'Kalkan',
    'منصة الفيزياء والأعداء السيبرانية':'Fizik platform vs siber düşmanlar',
    'المتجر':'Mağaza','الوقت':'Süre','سهل':'Kolay','عادي':'Normal','صعب':'Zor'
  };

  /* === النسخة الأصلية للترجمة الإنجليزية === */
  const ORIG_EN = Object.assign({}, EN);

  G.displayLang = ld('displayLang', null);

  function applyPack(lang){
    if(!lang || lang === 'ar' || lang === 'en'){
      for(const k in ORIG_EN) EN[k] = ORIG_EN[k];
      return;
    }
    const pack = PACKS[lang];
    if(!pack) return;
    for(const k in ORIG_EN) EN[k] = pack[k] || ORIG_EN[k];
  }

  function switchTo(lang, doRender){
    if(!LANGS[lang]) return;
    G.displayLang = lang;
    sv('displayLang', lang);
    if(lang === 'ar'){
      LANG = 'ar';
      for(const k in ORIG_EN) EN[k] = ORIG_EN[k];
    } else {
      LANG = 'en';
      applyPack(lang);
    }
    _tcm.clear();
    applyLang();
    if(G.state === 'PLAY') G.syncHud();
    if(doRender && G.state === 'MENU') G.menu();
  }

  G.setLangUI = function(code){
    if(!LANGS[code]) return;
    A.pickup();
    switchTo(code, true);
  };

  /* === شاشة اختيار اللغة === */
  G.showLangs = function(){
    this.state = 'MENU';
    this.hud(0);
    const cards = Object.entries(LANGS).map(([code, info]) => {
      const active = G.displayLang === code;
      return `<div class="card ${active?'on':''}" onclick="G.setLangUI('${code}')">
        <b style="font-size:32px">${info.flag}</b>
        <span>${info.name}</span>
        <span style="font-size:11px">${active?'✅':'—'}</span>
      </div>`;
    }).join('');
    this.ui(`<h2 style="color:#00f0ff">🌐 Language / اللغة</h2>
      <p class="sub">Choose your language — اختر لغتك</p>
      <div class="grid cards" style="max-width:600px">${cards}</div>
      <button class="btn" onclick="G.menu()">${tr('العودة')}</button>`);
  };

  G.lang = function(){ G.showLangs(); };

  /* === إعادة تعريف applyLang لاحترام اللغة المختارة === */
  applyLang = function(){
    const lang = G.displayLang || 'ar';
    const info = LANGS[lang] || LANGS.ar;
    const d = document.documentElement;
    d.lang = lang;
    d.dir = info.dir;
    document.title = 'Neon Flux' + (lang === 'ar' ? ' - نيون فلوكس' : '') + ' by Maru Games';
    document.querySelectorAll('#hud small,#hud button,#tc button').forEach(e => {
      if(e.dataset.a == null) e.dataset.a = e.textContent;
      e.textContent = tr(e.dataset.a);
    });
  };

  /* === زر اللغة في القائمة === */
  const _menu = G.menu;
  G.menu = function(){
    _menu.call(this);
    setTimeout(() => {
      const scr = document.querySelector('#ui .scr');
      if(!scr || scr.querySelector('.lang-btn')) return;
      const btns = Array.from(scr.querySelectorAll('.btn'));
      const oldLangBtn = btns.find(b => b.textContent.includes('🌐'));
      if(oldLangBtn) oldLangBtn.style.display = 'none';
      const info = LANGS[G.displayLang] || LANGS.ar;
      const btn = document.createElement('button');
      btn.className = 'btn lang-btn';
      btn.style.cssText = 'background:linear-gradient(90deg,#00f0ff,#a64dff);color:#021018;font-weight:900;border:0;box-shadow:0 0 20px rgba(0,240,255,.5);min-width:0;font-size:14px;padding:8px 16px;border-radius:11px;cursor:pointer';
      btn.textContent = '🌐 ' + info.name + ' ' + info.flag;
      btn.onclick = () => G.showLangs();
      const backBtn = btns.find(b => b.textContent.includes('العودة') || b.textContent.includes('Back'));
      if(backBtn) backBtn.parentNode.insertBefore(btn, backBtn);
      else {
        const smallRow = scr.querySelector('div[style*="flex-wrap"]');
        if(smallRow) smallRow.appendChild(btn);
        else scr.appendChild(btn);
      }
    }, 180);
  };

  /* === التطبيق الأولي === */
  const stored = G.displayLang;
  if(stored && stored !== 'ar' && stored !== 'en'){
    LANG = 'en';
    applyPack(stored);
    _tcm.clear();
    applyLang();
  } else if(stored === 'ar'){
    LANG = 'ar';
  } else if(!stored){
    const bl = (navigator.language || 'ar').toLowerCase().slice(0, 2);
    if(LANGS[bl] && bl !== 'ar'){
      switchTo(bl, false);
    } else if(bl === 'ar'){
      G.displayLang = 'ar';
      sv('displayLang', 'ar');
    } else {
      G.displayLang = 'ar';
      sv('displayLang', 'ar');
    }
  }

  setTimeout(() => { try{ if(G.state === 'MENU') G.menu(); }catch(e){} }, 400);

  console.log('🌐 7 languages ready: ar, en, es, de, fr, it, tr');

})();

   (سلاح + تحدي اليوم + الإنجازات + المهارات)
   ═══════════════════════════════════════════════ */
(function(){

  const PACKS = window.__LANG_PACKS;
  if(!PACKS){ console.error('Language patch missing'); return; }

  /* === إضافة الكلمات الناقصة للقاموس الأساسي === */
  EN['سلاح'] = 'Weapon';
  EN['تحدي اليوم'] = 'Daily Challenge';
  EN['الإنجازات'] = 'Achievements';
  EN['Boss Rush'] = 'Boss Rush';
  EN['Endless'] = 'Endless';

  /* === إضافة الترجمات لكل لغة === */
  const packAdd = {
    es: {'سلاح':'Arma','تحدي اليوم':'Desafío Diario','الإنجازات':'Logros','Boss Rush':'Boss Rush','Endless':'Infinito'},
    de: {'سلاح':'Waffe','تحدي اليوم':'Tägliche','الإنجازات':'Erfolge','Boss Rush':'Boss Rush','Endless':'Endlos'},
    fr: {'سلاح':'Arme','تحدي اليوم':'Défi Quotidien','الإنجازات':'Succès','Boss Rush':'Boss Rush','Endless':'Infini'},

  };
  for(const lang in packAdd){
    if(PACKS[lang]) Object.assign(PACKS[lang], packAdd[lang]);
  }

  /* === أسماء المهارات بكل اللغات === */
  const SKILL_NAMES = {
    ar: ['ضربة الظل','درع النيون','موجة صدمة','نيزك','ضربة أرضية','طيران ناري','تجميد شامل','هجوم الظل'],
    en: ['Shadow Strike','Neon Shield','Shockwave','Meteor','Ground Slam','Fire Flight','Total Freeze','Shadow Attack'],
    es: ['Golpe Sombrío','Escudo Neón','Onda de Choque','Meteoro','Golpe Terrestre','Vuelo de Fuego','Congelación Total','Ataque Sombrío'],
    de: ['Schattenstoß','Neon-Schild','Schockwelle','Meteor','Bodenschlag','Feuerflug','Totale Erstarrung','Schattenangriff'],
    fr: ['Frappe Sombre','Bouclier Néon','Onde de Choc','Météore','Frappe au Sol','Vol de Feu','Gel Total','Attaque Sombre'],
    it: ['Colpo d\'Ombra','Scudo Neon','Onda d\'Urto','Meteora','Colpo a Terra','Volo di Fuoco','Congelamento Totale','Attacco d\'Ombra'],
    tr: ['Gölge Vuruşu','Neon Kalkan','Şok Dalgası','Meteor','Yer Vuruşu','Ateş Uçuşu','Tam Donma','Gölge Saldırısı']
  };

  function getLang(){ return G.displayLang || 'ar'; }

  /* === دالة الترجمة الشاملة === */
  function translateExtras(){
    const lang = getLang();
    const names = SKILL_NAMES[lang] || SKILL_NAMES.ar;

    /* زر السلاح */
    const bw = document.getElementById('bw');
    if(bw) bw.textContent = tr('سلاح');

    /* اسم المهارة */
    const nameEl = document.getElementById('skillName');
    if(nameEl) nameEl.textContent = '⚡ ' + (names[G.ci] || names[0]);

    /* أزرار الأوضاع في القائمة */
    document.querySelectorAll('.mode-btn').forEach(btn => {
      const txt = btn.textContent;
      if(txt.match(/Boss|⚔️/i)) btn.textContent = '⚔️ ' + tr('Boss Rush');
      else if(txt.match(/Endless|♾️/i)) btn.textContent = '♾️ ' + tr('Endless');
      else if(txt.match(/Daily|تحدي|📅/i)) btn.textContent = '📅 ' + tr('تحدي اليوم');
      else if(txt.match(/Achievements|الإنجازات|🏆/i)) btn.textContent = '🏆 ' + tr('الإنجازات');
    });
  }

  /* === Hook on applyLang — يشتغل بعد كل تغيير لغة === */
  const _applyLang = window.applyLang || (typeof applyLang !== 'undefined' ? applyLang : null);
  if(typeof _applyLang === 'function'){
    const wrapped = function(){
      _applyLang();
      setTimeout(translateExtras, 30);
    };
    try { window.applyLang = wrapped; } catch(e){}
    try { applyLang = wrapped; } catch(e){}
  }

  /* === Hook syncHud — يترجم اسم المهارة كل مرة === */
  const _syncHud = G.syncHud;
  G.syncHud = function(){
    _syncHud.call(this);
    const nameEl = document.getElementById('skillName');
    if(nameEl){
      const names = SKILL_NAMES[getLang()] || SKILL_NAMES.ar;
      nameEl.textContent = '⚡ ' + (names[this.ci] || names[0]);
    }
  };

  /* === Hook menu — يترجم أزرار الأوضاع بعد ما تترسم === */
  const _menu = G.menu;
  G.menu = function(){
    _menu.call(this);
    setTimeout(translateExtras, 250);
  };

  /* === Hook setLangUI — يترجم فوراً عند تغيير اللغة === */
  const _setLangUI = G.setLangUI;
  if(typeof _setLangUI === 'function'){
    G.setLangUI = function(code){
      _setLangUI.call(this, code);
      setTimeout(()=>{
        translateExtras();
        if(G.state === 'PLAY') G.syncHud();
      }, 120);
    };
  }

  /* === إعادة تطبيق اللغة الحالية عشان القاموس يتحدث === */
  setTimeout(()=>{
    const lang = getLang();
    if(lang && lang !== 'ar' && lang !== 'en'){
      const pack = PACKS[lang];
      if(pack){
        /* إعادة تحديث EN بالكلمات الجديدة */
        for(const k in pack) EN[k] = pack[k];
        _tcm.clear();
      }
    }
    translateExtras();
    if(G.state === 'PLAY') G.syncHud();
  }, 600);

  /* === ترجمة فورية لو القائمة مفتوحة === */
  setTimeout(translateExtras, 900);

  console.log('✅ Translation completion loaded');

})();

/* ═══════════════════════════════════════════════
   PWA PATCH — PART 1: Meta + Manifest + Icons
   ═══════════════════════════════════════════════ */
(function(){

  /* 1. تحديث meta tags للهاتف */
  let vp = document.querySelector('meta[name="viewport"]');
  if(!vp){
    vp = document.createElement('meta');
    vp.name = 'viewport';
    document.head.appendChild(vp);
  }
  vp.content = 'width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover';

  const metas = [
    ['theme-color', '#050514'],
    ['apple-mobile-web-app-capable', 'yes'],
    ['apple-mobile-web-app-status-bar-style', 'black-translucent'],
    ['apple-mobile-web-app-title', 'Neon Flux'],
    ['mobile-web-app-capable', 'yes'],
    ['application-name', 'Neon Flux'],
    ['description', 'Neon Flux by Maru Games - Cyber Platformer']
  ];
  metas.forEach(([name, content])=>{
    if(!document.querySelector(`meta[name="${name}"]`)){
      const m = document.createElement('meta');
      m.name = name;
      m.content = content;
      document.head.appendChild(m);
    }
  });

  /* 2. أيقونة SVG مدمجة */
  const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient></defs><rect width="512" height="512" fill="#050514"/><text x="256" y="340" font-family="Impact,Arial,sans-serif" font-size="200" font-weight="900" fill="url(#g)" text-anchor="middle">NF</text><circle cx="256" cy="410" r="50" fill="none" stroke="#ffd23f" stroke-width="6" opacity="0.8"/></svg>`;
  const iconURI = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgIcon);

  /* 3. Favicon + Apple touch icon */
  ['icon', 'apple-touch-icon', 'shortcut icon'].forEach(rel => {
    let l = document.querySelector(`link[rel="${rel}"]`);
    if(!l){
      l = document.createElement('link');
      l.rel = rel;
      document.head.appendChild(l);
    }
    l.href = iconURI;
  });

  /* 4. Manifest PWA */
  const manifest = {
    name: 'Neon Flux by Maru Games',
    short_name: 'Neon Flux',
    description: 'لعبة منصة نيون - Cyber Platformer',
    start_url: location.href.split('?')[0].split('#')[0],
    scope: './',
    display: 'fullscreen',
    orientation: 'landscape',
    background_color: '#050514',
    theme_color: '#00f0ff',
    lang: 'ar',
    dir: 'rtl',
    categories: ['games', 'entertainment'],
    icons: [
      {src: iconURI, sizes: '192x192', type: 'image/svg+xml', purpose: 'any'},
      {src: iconURI, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable'}
    ]
  };

  try{
    const blob = new Blob([JSON.stringify(manifest)], {type: 'application/manifest+json'});
    const url = URL.createObjectURL(blob);
    let ml = document.querySelector('link[rel="manifest"]');
    if(!ml){
      ml = document.createElement('link');
      ml.rel = 'manifest';
      document.head.appendChild(ml);
    }
    ml.href = url;
    console.log('✅ Manifest ready');
  }catch(e){ console.warn('Manifest error', e); }

  /* 5. تخزين حالة التثبيت */
  let deferredPrompt = null;
  window.__deferredPrompt = null;

  addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    window.__deferredPrompt = e;
    console.log('📲 Install prompt ready');
    if(G.state === 'MENU') setTimeout(()=>G.menu(), 200);
  });

  addEventListener('appinstalled', () => {
    console.log('✅ App installed');
    window.__deferredPrompt = null;
    if(A && A.pickup) A.pickup();
  });

  console.log('📱 PWA Part 1 ready');

})();

/* ═══════════════════════════════════════════════
   PWA PATCH — PART 2: Install + Fullscreen + Rotate
   ═══════════════════════════════════════════════ */
(function(){

  /* 1. حالة الشاشة الكاملة */
  G.isFullscreen = false;

  G.toggleFullscreen = function(){
    const el = document.documentElement;
    try{
      if(!document.fullscreenElement && !document.webkitFullscreenElement){
        const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
        if(req) req.call(el).then(()=>{
          G.isFullscreen = true;
          if(A && A.pickup) A.pickup();
          setTimeout(()=>G.menu(), 200);
        }).catch(()=>{
          /* فشل — حاول على canvas */
          const cv = document.getElementById('c');
          const r2 = cv.requestFullscreen || cv.webkitRequestFullscreen;
          if(r2) r2.call(cv).then(()=>{G.isFullscreen=true;setTimeout(()=>G.menu(),200)}).catch(()=>{});
        });
      }else{
        const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
        if(exit) exit.call(document).then(()=>{
          G.isFullscreen = false;
          setTimeout(()=>G.menu(), 200);
        });
      }
    }catch(e){ console.warn('Fullscreen error', e); }
  };

  document.addEventListener('fullscreenchange', ()=>{
    G.isFullscreen = !!document.fullscreenElement;
  });
  document.addEventListener('webkitfullscreenchange', ()=>{
    G.isFullscreen = !!(document.webkitFullscreenElement);
  });

  /* 2. زر التثبيت */
  G.installApp = function(){
    const prompt = window.__deferredPrompt;
    if(prompt){
      prompt.prompt();
      prompt.userChoice.then(choice => {
        console.log('Install choice:', choice.outcome);
        window.__deferredPrompt = null;
      });
    }else{
      /* مفيش prompt → أظهر تعليمات */
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const isAndroid = /Android/.test(navigator.userAgent);
      let msg = '📲 لتثبيت اللعبة:\n\n';
      if(isIOS){
        msg += '1. اضغط زر المشاركة (مربع بسهم فوق)\n2. اختار "Add to Home Screen"\n3. اضغط Add';
      }else if(isAndroid){
        msg += '1. اضغط ⋮ (٣ نقط)\n2. اختار "Install app" أو "Add to Home screen"\n3. اضغط Install';
      }else{
        msg += '1. اضغط ⋮ أو ☰\n2. اختار "Install Neon Flux" أو "Add to Home Screen"';
      }
      alert(msg);
    }
  };

  /* 3. تنبيه تدوير الشاشة على الموبايل */
  function checkOrientation(){
    if(G.state !== 'PLAY') return;
    const isMobile = 'ontouchstart' in window || matchMedia('(pointer:coarse)').matches;
    if(!isMobile) return;
    const isPortrait = window.innerHeight > window.innerWidth;
    let el = document.getElementById('rotateHint');
    if(isPortrait && !el){
      el = document.createElement('div');
      el.id = 'rotateHint';
      el.style.cssText = `
        position:fixed;inset:0;z-index:9999;
        background:rgba(5,4,20,.95);
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        color:#00f0ff;font-family:Cairo,sans-serif;text-align:center;padding:20px;
        backdrop-filter:blur(10px);
      `;
      el.innerHTML = `
        <div style="font-size:64px;margin-bottom:16px;animation:rotSpin 2s ease-in-out infinite">📱</div>
        <h2 style="font-size:22px;margin:0 0 10px;color:#ffd23f;text-shadow:0 0 20px #ffd23f">أدر الجها</h2>
        <p style="font-size:14px;color:#9aa0c8;margin:0">لف الهاتف أفقياً للعب أفضل</p>
        <button onclick="this.parentNode.remove()" style="margin-top:20px;padding:10px 24px;border-radius:12px;background:linear-gradient(90deg,#00f0ff,#2bffb0);border:0;color:#021018;font-weight:900;font-family:Cairo;font-size:14px;cursor:pointer">متابعة</button>
      `;
      if(!document.getElementById('rotStyle')){
        const st = document.createElement('style');
        st.id = 'rotStyle';
        st.textContent = `@keyframes rotSpin {0%,100%{transform:rotate(0)}50%{transform:rotate(-90deg)}}`;
        document.head.appendChild(st);
      }
      document.body.appendChild(el);
    }else if(!isPortrait && el){
      el.remove();
    }
  }
  addEventListener('resize', checkOrientation);
  setInterval(checkOrientation, 1500);

  /* 4. إضافة الأزرار في القائمة الرئيسية */
  const _menu = G.menu;
  G.menu = function(){
    _menu.call(this);
    setTimeout(()=>{
      const scr = document.querySelector('#ui .scr');
      if(!scr || scr.querySelector('.pwa-row')) return;

      const row = document.createElement('div');
      row.className = 'pwa-row';
      row.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%;max-width:520px;margin:4px 0';

      /* زر الشاشة الكاملة */
      const btnFS = document.createElement('button');
      btnFS.className = 'btn pwa-btn';
      btnFS.style.cssText = 'background:linear-gradient(90deg,#00f0ff,#a64dff);color:#021018;font-weight:900;border:0;font-size:12px;padding:7px 12px;min-width:0;border-radius:11px;cursor:pointer;box-shadow:0 0 15px rgba(0,240,255,.4)';
      btnFS.textContent = G.isFullscreen ? '🔙 إنهاء الشاشة' : '⛶ شاشة كاملة';
      btnFS.onclick = ()=>{ G.toggleFullscreen(); };
      row.appendChild(btnFS);

      /* زر التثبيت */
      const btnInstall = document.createElement('button');
      btnInstall.className = 'btn pwa-btn';
      const canInstall = !!window.__deferredPrompt;
      btnInstall.style.cssText = `background:${canInstall?'linear-gradient(90deg,#2bffb0,#ffd23f)':'rgba(8,6,28,.8)'};color:${canInstall?'#021018':'#2bffb0'};font-weight:900;border:${canInstall?'0':'2px solid #2bffb0'};font-size:12px;padding:7px 12px;min-width:0;border-radius:11px;cursor:pointer;box-shadow:0 0 15px rgba(43,255,176,.4)`;
      btnInstall.textContent = canInstall ? '📲 تثبيت التطبيق' : '📲 طريقة التثبيت';
      btnInstall.onclick = ()=>{ G.installApp(); };
      row.appendChild(btnInstall);

      /* مكان الأزرار — بعد صف الجهاز لو موجود */
      const deviceRow = scr.querySelector('.device-btn')?.parentNode;
      const diffRow = scr.querySelector('.diff-btn')?.parentNode;
      const modesRow = scr.querySelector('.mode-btn')?.parentNode;
      const ref = deviceRow || diffRow || modesRow;
      if(ref && ref.parentNode) ref.parentNode.insertBefore(row, ref.nextSibling);
      else scr.appendChild(row);
    }, 200);
  };

  /* 5. منع السحب والزوم */
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('gesturechange', e => e.preventDefault());
  document.addEventListener('gestureend', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault(), {passive: false});

  /* 6. منع السكرول لما تلعب */
  const origUpdate = G.update;
  G.update = function(){
    if(this.state === 'PLAY'){
      document.body.style.overflow = 'hidden';
    }
    origUpdate.call(this);
  };

  /* 7. عند فتح اللعبة — حاول تفعيل fullscreen تلقائياً (اختياري) */
  let autoFsTried = false;
  document.addEventListener('click', ()=>{
    if(!autoFsTried && G.state === 'MENU' && ld('autoFs', false)){
      autoFsTried = true;
    }
  }, {once: true});

  /* 8. تحديث القائمة */
  setTimeout(()=>{ try{ if(G.state==='MENU') G.menu(); }catch(e){} }, 500);

  console.log('📱 PWA Part 2 ready — Install + Fullscreen + Rotate');

})();

/* ═══════════════════════════════════════════════
   MENU LAYOUT FIX — إصلاح القائمة الرئيسية
   ═══════════════════════════════════════════════ */
(function(){

  /* 1. CSS fix — نخلي القائمة تبدأ من فوق وتـscroll */
  if(!document.getElementById('menuFixStyle')){
    const style = document.createElement('style');
    style.id = 'menuFixStyle';
    style.textContent = `
      /* القائمة الرئيسية — تبدأ من فوق وتـscroll */
      .scr {
        justify-content: flex-start !important;
        padding-top: 20px !important;
        padding-bottom: 60px !important;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch;
        gap: 7px !important;
      }
      .scr .logo {
        font-size: clamp(32px, 9vw, 64px) !important;
        margin: 6px 0 !important;
        letter-spacing: 3px !important;
      }
      .scr h2 {
        font-size: clamp(20px, 5vw, 36px) !important;
        margin: 4px 0 !important;
      }
      .scr .sub {
        font-size: 12px !important;
        margin: 2px 0 6px !important;
      }
      .scr .btn {
        padding: 8px 16px !important;
        font-size: 14px !important;
        min-width: 170px !important;
        border-radius: 11px !important;
      }
      .scr .btn.p {
        font-size: 17px !important;
        padding: 10px 20px !important;
        min-width: 200px !important;
      }
      .scr .hint {
        font-size: 10px !important;
        margin: 6px 0 !important;
        max-width: 380px !important;
      }
      .scr .stat {
        padding: 8px 14px !important;
        font-size: 12px !important;
        min-width: 200px !important;
      }
      /* أزرار الباتشات (mode/diff/device/pwa) */
      .scr .btn.mode-btn,
      .scr .btn.diff-btn,
      .scr .btn.device-btn,
      .scr .btn.pwa-btn {
        padding: 5px 10px !important;
        font-size: 11px !important;
        min-width: 0 !important;
      }
      /* على الشاشات الصغيرة */
      @media (max-height: 720px) {
        .scr {
          padding-top: 12px !important;
          padding-bottom: 30px !important;
          gap: 5px !important;
        }
        .scr .logo { font-size: clamp(26px, 7vw, 42px) !important; }
        .scr .btn { font-size: 13px !important; padding: 6px 14px !important; }
        .scr .btn.p { font-size: 15px !important; padding: 8px 16px !important; }
      }
      @media (max-height: 560px) {
        .scr {
          gap: 3px !important;
          padding-top: 8px !important;
        }
        .scr .logo { font-size: 22px !important; letter-spacing: 2px !important; }
        .scr .sub { display: none !important; }
        .scr .btn { font-size: 11px !important; padding: 4px 10px !important; }
        .scr .btn.p { font-size: 13px !important; padding: 6px 14px !important; }
        .scr .hint { display: none !important; }
      }
      /* شريط جانبي اختياري */
      .scr::-webkit-scrollbar { width: 5px; }
      .scr::-webkit-scrollbar-thumb {
        background: rgba(0,240,255,.35);
        border-radius: 3px;
      }
    `;
    document.head.appendChild(style);
  }

  /* 2. تأكد إن القائمة مخفية أثناء القائمة */
  const origMenu = G.menu;
  G.menu = function(){
    origMenu.call(this);
    setTimeout(()=>{
      const tc = document.getElementById('tc');
      if(tc) tc.classList.add('hide');
      const hud = document.getElementById('hud');
      if(hud) hud.classList.add('hide');
      /* scroll للفوق عند فتح القائمة */
      const scr = document.querySelector('#ui .scr');
      if(scr) scr.scrollTop = 0;
    }, 20);
  };

  /* 3. تنظيم الأزرار في مجموعات أوضح */
  const origMenu2 = G.menu;
  G.menu = function(){
    origMenu2.call(this);
    setTimeout(()=>{
      const scr = document.querySelector('#ui .scr');
      if(!scr) return;

      /* لف الأزرار في مجموعات لو مش ملفوفة */
      const allBtns = Array.from(scr.querySelectorAll('.btn'));
      const mainBtns = allBtns.filter(b => !b.classList.contains('mode-btn')
        && !b.classList.contains('diff-btn')
        && !b.classList.contains('device-btn')
        && !b.classList.contains('pwa-btn')
        && !b.classList.contains('lang-btn')
        && !b.classList.contains('s'));
      const smallBtns = allBtns.filter(b => (b.classList.contains('s') || b.classList.contains('lang-btn'))
        && !b.classList.contains('mode-btn')
        && !b.classList.contains('diff-btn')
        && !b.classList.contains('device-btn')
        && !b.classList.contains('pwa-btn'));

      /* تأكد إن mainBtns كلهم ظاهرين */
      mainBtns.forEach(b => {
        if(b.style.display === 'none') b.style.display = '';
      });

      /* تأكد إن كل الأزرار الصغيرة في صف واحد */
      const existingSmallRow = scr.querySelector('.small-btns-row');
      if(smallBtns.length > 0 && !existingSmallRow){
        const row = document.createElement('div');
        row.className = 'small-btns-row';
        row.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%;max-width:520px;margin:4px 0';
        smallBtns.forEach(b => row.appendChild(b));
        scr.appendChild(row);
      }
    }, 250);
  };

  /* 4. تحديث فوري */
  setTimeout(()=>{ try{ if(G.state==='MENU') G.menu(); }catch(e){} }, 200);

  console.log('📐 Menu layout fixed');

})();
</script>
